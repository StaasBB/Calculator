<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

            <a class="header-img-a" href="https://www.twitch.tv/blindwalkerboy" target="_blank"><img class="header-img" src="./src/assets/social/twitch.png"/></a>
            <a class="header-img-a" href="https://boosty.to/rfabteam" target="_blank"><img class="header-img" src="./src/assets/social/boosty.png"/></a>
        </div>
        <div class="header-separator-200"></div>
        <div class="header-links">
            <a class="header-link" href="https://t.me/SkyrimRFAB" target="_blank">СКАЧАТЬ</a>
            <a class="header-link" href="https://skyrimrequiem.ru/pages/media/" target="_blank">МЕДИА</a>
            <a class="header-link" href="https://skyrimrequiem.ru/pages/leaderboard/" target="_blank">ПАНТЕОН</a>
            <a class="header-link" href="https://skyrimrequiem.ru/pages/library/" target="_blank">БАЗА ЗНАНИЙ</a>
            <a class="header-link active double-row" href="#">КАЛЬКУЛЯТОР<br>ПЕРКОВ</a>
            <a class="header-link" href="https://drive.google.com/drive/folders/1-t0x5t0t_Hq_HeQChVD1PXV3zpYRUmPV" target="_blank">OBLIVION</a>

    <!-- таб бар) -->
    <div class="tab-bar app-utilities-bar">
        <button class="tab-button" id="btn-share">Поделиться билдом</button>
        <button class="tab-button" id="trigger-load">Загрузить</button>
        <button class="tab-button" id="trigger-save">Сохранить</button>
        <button class="tab-button" id="btn-reset-tree">Сбросить ветку</button>
        <button class="tab-button btn-danger" id="btn-reset-all">Сбросить всё</button>
        <!-- ИСПРАВЛЕНО: Отсюда блок profiles-dropdown полностью УДАЛЕН -->
    </div>

    <!-- КОНТЕЙНЕР ДЛЯ ХОЛСТА КАЛЬКУЛЯТОРА -->
    <main id="canvas-container">
        <canvas id="gameCanvas" width="960" height="800"></canvas>
    </main>

    <!-- ОРИГИНАЛЬНЫЙ ФУТЕР RFAB -->
    <footer>
        <a class="header-img-a" href="https://skyrimrequiem.ru">
            <img class="header-img" src="./src/assets/logo.png"/>
        </a>
        <div style="width:100px"></div>
        <div class="footer-text">
            <p>Выражаем благодарность Xandr за разрешение на создание нашего проекта на базе Requiem for a Dream.</p>
            <p>
                <a href="https://discord.com/invite/0pBEeD7mhisZVv76" target="_blank">Discord оригинального Requiem от Xarrian и ogerboss</a>

            <a class="header-img-a" href="https://www.youtube.com/c/BlindWalker/videos" target="_blank"><img class="header-img" src="./src/assets/social/youtube.png"/></a>
            <a class="header-img-a" href="https://www.twitch.tv/blindwalkerboy" target="_blank"><img class="header-img" src="./src/assets/social/twitch.png"/></a>
            <a class="header-img-a" href="https://boosty.to/rfabteam" target="_blank"><img class="header-img" src="./src/assets/social/boosty.png"/></a>
        </div>
    </footer>
    <!-- ИСПРАВЛЕНО: Выпадающее меню перенесено в самый корень body, чтобы экранный JS-расчет совпал на 100% -->
    <div class="profiles-dropdown" id="profiles-dropdown-list"></div>

    <script type="module" src="./src/app.js"></script>
